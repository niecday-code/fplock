<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4e7e2">
<title>FPLock 遙控</title>
<style>
:root{
  --base:#e4e7e2; --panel:#f3f4f0; --ink:#171c1f; --mute:#5b6670; --line:#b9c0bb;
  --go:#0c6b61; --go-ink:#f3f4f0; --stop:#a82a22; --off:#8a949b;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--base:#12181b;--panel:#1b2428;--ink:#e6ebe9;--mute:#93a0a6;--line:#2f3b41;--go:#2bb3a3;--go-ink:#08201d;--stop:#e0675e;--off:#5d6a71}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--base);color:var(--ink)}
body{font-family:"Roboto Condensed","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
#conn{border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:15px;
  padding:9px 14px;border-radius:999px;min-height:44px}
#conn[data-ok="1"]{border-color:var(--go);color:var(--go)}
.plate{background:var(--panel);border:2px solid var(--line);border-radius:22px;display:grid;
  grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 14px;margin-bottom:14px}
.plate span{font-size:18px;color:var(--mute);text-align:center}
.knob{position:relative;width:128px;height:128px;border-radius:50%;border:3px solid var(--ink);margin:0 6px}
.knob i{position:absolute;left:50%;top:10px;width:8px;height:44px;margin-left:-4px;border-radius:4px;
  background:var(--off);transform-origin:50% 54px;transform:rotate(0deg);transition:transform .35s cubic-bezier(.3,1.4,.5,1),background .2s}
.knob[data-s="on"] i{background:var(--go);transform:rotate(-52deg)}
.knob[data-s="off"] i{background:var(--stop);transform:rotate(52deg)}
.knob b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;padding-top:58px}
#spd{margin:-4px 2px 12px;font-size:15px;color:var(--mute);text-align:center;min-height:22px}
#toast{position:fixed;left:14px;right:14px;bottom:max(18px,env(safe-area-inset-bottom));max-width:492px;margin:0 auto;
  padding:14px 16px;border-radius:14px;background:var(--ink);color:var(--base);font-size:17px;opacity:0;
  transform:translateY(12px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#toast.bad{background:var(--stop);color:#fff}
.fpr{padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.fpt{display:flex;align-items:center;gap:8px}
.fpt .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.fpe{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fpe[hidden]{display:none}
.del{position:relative;overflow:hidden;border-color:var(--stop);color:var(--stop);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.del::before{content:"";position:absolute;inset:0;background:var(--stop);opacity:.22;transform:scaleX(0);transform-origin:left;transition:transform 0s}
.del.holding::before{transform:scaleX(1);transition:transform var(--hold,1s) linear}
.del:disabled{opacity:.45}
.fpr select{font:inherit;font-size:16px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{position:relative;overflow:hidden;min-height:104px;border-radius:20px;border:2px solid var(--ink);
  background:var(--panel);color:var(--ink);font:inherit;text-align:left;padding:14px 16px;
  display:flex;flex-direction:column;justify-content:space-between;touch-action:manipulation;
  user-select:none;-webkit-user-select:none}
.act strong{font-size:26px;line-height:1.1;position:relative}
.act small{font-size:14px;color:var(--mute);position:relative}
.act.go{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.act.go small{color:inherit;opacity:.85}
.act.stop{border-color:var(--stop)}
.act.stop::before{content:"";position:absolute;inset:0;background:var(--stop);opacity:.22;
  transform:scaleX(0);transform-origin:left;transition:transform 0s}
.act.stop.holding::before{transform:scaleX(1);transition:transform var(--hold,.8s) linear}
.act:disabled{opacity:.45}
.act:focus-visible,#conn:focus-visible,.mini:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
details{margin-top:16px;border-top:2px solid var(--line);padding-top:10px}
summary{font-size:16px;color:var(--mute);min-height:40px;display:flex;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.mini{font:inherit;font-size:16px;min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);
  background:var(--panel);color:var(--ink)}
input{flex:1;min-width:0;font:inherit;font-size:16px;min-height:44px;border-radius:12px;border:2px solid var(--line);
  background:var(--panel);color:var(--ink);padding:0 12px}
pre{margin:8px 0 0;max-height:240px;overflow:auto;font:13px/1.45 ui-monospace,Menlo,monospace;
  background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px;white-space:pre-wrap}
@media (prefers-reduced-motion:reduce){.knob i{transition:none}}
</style>
</head>
<body>
<header>
  <h1>FPLock</h1>
  <button id="conn" data-ok="0">連線</button>
</header>

<section class="plate" aria-label="電門狀態">
  <span>開</span>
  <div class="knob" id="knob" data-s="?" role="img" aria-label="電門狀態未知"><i></i><b id="knobTxt">—</b></div>
  <span>關</span>
</section>

<div id="spd"></div>
<section class="grid" id="grid"></section>
<div id="toast" role="status"></div>

<details>
  <summary>清單</summary>
  <div class="row"><button class="mini" id="fpRefresh">重新整理</button></div>
  <div id="fpl">尚未讀取。</div>
</details>
<details>
  <summary>記錄</summary>
  <pre id="log" aria-live="polite"></pre>
</details>
<details>
  <summary>選單</summary>
  <div class="row" id="menu"></div>
  <div class="row"><input id="free" placeholder="輸入文字,按 Enter 送出" autocomplete="off"><button class="mini" id="sendFree">送出</button></div>
</details>

<script>
// ===== 這一區可自行修改 =====
// 指令對照:韌體階段 9 的 @ 指令(不受選單狀態影響)。填 null 可停用該按鈕。
const CMD = { accOn: '@acc on', accOff: '@acc off', seat: '@seat', fuel: '@fuel' };
const HOLD_MS = 800;   // 「按住」按鈕要按多久才送出
const BUTTONS = [
  { cmd: 'accOn',  label: '電門開', sub: '輕點', hold: false, cls: 'go'   },
  { cmd: 'accOff', label: '電門關', sub: '按住', hold: true,  cls: 'stop' },
  { cmd: 'seat',   label: '座墊',   sub: '輕點', hold: false, cls: ''     },
  { cmd: 'fuel',   label: '油箱蓋', sub: '按住', hold: true,  cls: 'stop' },
];
const MENU = [['新增','1'],['刪除','2'],['清單','3'],['進階','6'],['取消','0']];
// ===== 以下是 Nordic UART 服務,和韌體一致 =====
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RXU = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // 手機寫入
const TXU = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // 裝置通知

const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder('utf-8');
let dev = null, rx = null, tx = null, buf = '';
const btnEls = [];

function log(t) {
  const el = $('log');
  el.textContent += t + '\n';
  const lines = el.textContent.split('\n');
  if (lines.length > 80) el.textContent = lines.slice(-60).join('\n');
  el.scrollTop = el.scrollHeight;
}
function setConn(text, ok) { const c = $('conn'); c.textContent = text; c.dataset.ok = ok ? '1' : '0'; refresh(); }
function setState(on) {
  const k = $('knob');
  k.dataset.s = on ? 'on' : 'off';
  $('knobTxt').textContent = on ? '開' : '關';
  k.setAttribute('aria-label', on ? '電門開啟' : '電門關閉');
}
function refresh() {
  const live = !!rx;
  btnEls.forEach(({ el, b }) => {
    el.disabled = !live || CMD[b.cmd] == null;
    el.querySelector('small').textContent = CMD[b.cmd] == null ? '尚未支援' : b.sub;
  });
  $('fpRefresh').disabled = !live;
}
const ACT_NAME = { acc_on: '電門開', acc_off: '電門關', seat: '座墊', fuel: '油箱蓋', name: '改名', del: '刪除' };
let fpRows = [];
function holdFire(el, ms, fn) {
  let timer = null;
  const start = () => {
    if (el.disabled || timer) return;
    el.style.setProperty('--hold', ms + 'ms');
    el.classList.add('holding');
    timer = setTimeout(() => { timer = null; el.classList.remove('holding'); fn(); }, ms);
  };
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } el.classList.remove('holding'); };
  el.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, cancel));
  el.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(); });
  el.addEventListener('keyup', cancel);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
function renderFp() {
  const box = $('fpl');
  box.textContent = '';
  if (!fpRows.length) { box.textContent = '沒有指紋。'; return; }
  fpRows.forEach(r => {
    const row = document.createElement('div'); row.className = 'fpr';
    const top = document.createElement('div'); top.className = 'fpt';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.id + '  ' + r.name;
    const edit = document.createElement('button'); edit.className = 'mini'; edit.textContent = '編輯';
    top.append(nm, edit);
    const ed = document.createElement('div'); ed.className = 'fpe'; ed.hidden = true;
    const inp = document.createElement('input'); inp.value = r.name; inp.maxLength = 20; inp.setAttribute('aria-label', '名稱');
    const save = document.createElement('button'); save.className = 'mini'; save.textContent = '儲存名稱';
    save.addEventListener('click', () => {
      const v = inp.value.trim();
      if (!v) { toast('名稱不可空白', true); return; }
      if (enc.encode(v).length > 20) { toast('名稱最多 20 位元組(約 6 個中文字)', true); return; }
      send('@name ' + r.id + ' ' + v);
    });
    const del = document.createElement('button'); del.className = 'mini del'; del.textContent = '刪除(按住 1 秒)';
    holdFire(del, 1000, () => send('@del ' + r.id));
    ed.append(inp, save, del);
    edit.addEventListener('click', () => { ed.hidden = !ed.hidden; edit.textContent = ed.hidden ? '編輯' : '收合'; });
    row.append(top, ed);
    box.appendChild(row);
  });
}
function loadFp() { fpRows = []; $('fpl').textContent = '讀取中…'; send('@fl'); }
let toastTimer = null;
function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, bad ? 3500 : 1800);
}
function handle(line) {
  const f = line.match(/^FP id=(\d+) name=(.*)$/);
  if (f) { fpRows.push({ id: +f[1], name: f[2] }); return; }
  if (line === 'FP end') { renderFp(); return; }
  if (!line.startsWith('ST ')) log(line);  // 狀態行每 5 秒一次,不進記錄
  let m0 = line.match(/^ST acc=(\d) spd=([\d.]+) sensor=(\d)/);
  if (m0) {
    setState(m0[1] === '1');
    $('spd').textContent = m0[3] === '1' ? '車速 ' + m0[2] + ' km/h' : '車速偵測未啟用(桌面測試)';
    return;
  }
  m0 = line.match(/^(OK|ERR) (\S+)\s*(.*)$/);
  if (m0) {
    const nm = ACT_NAME[m0[2]] || m0[2];
    if (m0[1] === 'OK' && (m0[2] === 'name' || m0[2] === 'del')) loadFp();
    if (m0[1] === 'OK') { toast(nm + ' 完成'); if (navigator.vibrate) navigator.vibrate(m0[2] === 'seat' || m0[2] === 'fuel' ? [30, 40, 30] : 20); }
    else { toast(nm + ' 被拒絕:' + m0[3], true); if (navigator.vibrate) navigator.vibrate([80, 60, 80]); }
    return;
  }
  const m = line.match(/繼電器[:：]\s*(吸附|釋放)/);
  if (m) setState(m[1] === '吸附');
  else if (line === '已吸附') setState(true);
  else if (line === '已釋放') setState(false);
}
function onNote(ev) {
  buf += dec.decode(ev.target.value, { stream: true });
  let i;
  while ((i = buf.indexOf('\n')) >= 0) {
    const line = buf.slice(0, i).replace(/\r/g, '').trim();
    buf = buf.slice(i + 1);
    if (line) handle(line);
  }
}
async function send(text) {
  if (!rx) return false;
  try { await rx.writeValueWithResponse(enc.encode(text + '\n')); log('> ' + text); return true; }
  catch (e) { log('送出失敗:' + e.message); return false; }
}
function onDisc() { rx = tx = null; setConn('重新連線', false); log('已斷線'); }
async function connect() {
  if (!navigator.bluetooth) {
    const m = '此瀏覽器未啟用 Web Bluetooth。Chrome 請以 https 網址開啟;Brave 請到 brave://flags/#brave-web-bluetooth-api 設為 Enabled 後重新啟動';
    log(m); toast(m, true); return;
  }
  try {
    if (!dev) {
      dev = await navigator.bluetooth.requestDevice({
        filters: [{ services: [NUS] }, { namePrefix: 'FPLock' }], optionalServices: [NUS] });
      dev.addEventListener('gattserverdisconnected', onDisc);
    }
    setConn('連線中…', false);
    const srv = await dev.gatt.connect();
    const svc = await srv.getPrimaryService(NUS);
    rx = await svc.getCharacteristic(RXU);
    tx = await svc.getCharacteristic(TXU);
    tx.addEventListener('characteristicvaluechanged', onNote);
    await tx.startNotifications();   // 第一次會跳出配對碼輸入
    setConn('已連線', true);
    send('@st');
    loadFp();
  } catch (e) {
    log('連線失敗:' + e.name + ' ' + e.message);
    toast('連線失敗:' + e.name + ' ' + e.message, true);
    rx = tx = null;
    setConn(dev ? '重新連線' : '連線', false);
  }
}
async function fire(b, el) {
  await send(CMD[b.cmd]);
}
function build() {
  const grid = $('grid');
  BUTTONS.forEach(b => {
    const el = document.createElement('button');
    el.className = 'act ' + b.cls;
    el.innerHTML = '<strong>' + b.label + '</strong><small></small>';
    if (!b.hold) {
      el.addEventListener('click', () => fire(b, el));
    } else {
      let timer = null;
      const start = () => {
        if (el.disabled || timer) return;
        el.style.setProperty('--hold', HOLD_MS + 'ms');
        el.classList.add('holding');
        timer = setTimeout(() => { timer = null; el.classList.remove('holding'); fire(b, el); }, HOLD_MS);
      };
      const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } el.classList.remove('holding'); };
      el.addEventListener('pointerdown', start);
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, cancel));
      el.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(); });
      el.addEventListener('keyup', cancel);
      el.addEventListener('contextmenu', e => e.preventDefault());
    }
    grid.appendChild(el);
    btnEls.push({ el, b });
  });
  MENU.forEach(([name, cmd]) => {
    const m = document.createElement('button');
    m.className = 'mini'; m.textContent = name;
    m.addEventListener('click', () => send(cmd));
    $('menu').appendChild(m);
  });
  const free = () => { const v = $('free').value.trim(); if (v) { send(v); $('free').value = ''; } };
  $('sendFree').addEventListener('click', free);
  $('free').addEventListener('keydown', e => { if (e.key === 'Enter') free(); });
  $('conn').addEventListener('click', connect);
  $('fpRefresh').addEventListener('click', loadFp);
  refresh();
}
build();
</script>
</body>
</html>
